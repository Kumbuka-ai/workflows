# The executable tests of the actions in this repository.
#
# A guard that only exists as a file is not a guard: these run on every pull
# request and on main, so a change that breaks one is red before any caller
# depends on it.
name: self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trivy-image-scan:
    name: trivy-image-scan (database seed decision)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: db-seed.sh decides fresh, stale, absent and broken correctly
        run: bash .github/actions/trivy-image-scan/tests/db-seed.test.sh
      - name: shellcheck
        run: shellcheck .github/actions/trivy-image-scan/*.sh .github/actions/trivy-image-scan/tests/*.sh
