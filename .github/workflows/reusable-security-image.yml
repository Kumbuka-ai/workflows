# Trivy against the container images a repository ships.
#
# Separate from `reusable-security.yml` rather than a job inside it, for a
# mechanical reason: this has a matrix over the images, and a matrix built from
# an empty list is not an empty matrix — GitHub refuses the whole workflow with
# a startup failure before any `if:` is evaluated. The alternative would be a
# sentinel entry so that a job could skip itself, which is a lie in the workflow
# to work around a parser. Repositories that ship no image do not call this.
#
# For the Maven repositories this is not an extra, it is the dependency scan.
# A filesystem scan of a pom.xml resolves only what the POM declares — the
# transitive closure needs the network, and Maven Central answers 429 to CI
# ranges. The image carries every jar that actually ships, so scanning it is
# both complete and offline. It also covers the base image's OS packages, which
# CodeQL never looked at.

name: security (images)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label set. Defaults to hosted, and the default stays hosted on
          purpose: this workflow is called by public repositories too, and a
          self-hosted default would hand anyone who opens a fork pull request a
          machine to run their code on.

          The private repositories of this organisation pass `apollo`. One
          label is enough — only those agents carry it, and they are registered
          into a runner group with selected repositories.
        required: false
        type: string
        default: ubuntu-latest
      trivy-severity:
        description: Severities that turn the run red. Everything below is reported.
        required: false
        type: string
        default: HIGH,CRITICAL
      image-targets:
        description: >-
          JSON array, one object per image:
          {"name": "...", "context": ".", "file": "Dockerfile", "build-args": ""}.
          A list, not a single image, because a repository may ship more than one
          — a backend and a frontend, say — and scanning one of two would report
          a coverage the repository does not have.
        required: true
        type: string

permissions:
  contents: read

jobs:

  trivy-image:
    name: trivy (image ${{ matrix.target.name }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.image-targets) }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # NO setup-buildx STEP, AND NO GITHUB CACHE: the build below runs on the
      # daemon's own default builder (the `docker` driver), with nothing to set up.
      #
      # The default builder resolves base images from the daemon's own store, so
      # on apollo it uses the images the golden image already holds. Measured on
      # apollo 2026-09-28: 0,94 s for the build with the daemon's builder against
      # 37,9 s with a `docker-container` builder that re-fetched every base image.
      # This step used to call setup-buildx only to select `driver: docker`, which
      # is the builder `build-push-action` uses when nobody sets one up.
      #
      # Organisation rule for jobs that run on apollo: no GitHub cache
      # (`cache-from`/`cache-to: type=gha`, `actions/cache`, the `cache:` input of
      # setup-node/setup-java) unless a measurement shows it to be faster. Measured
      # in a real ee-worklist run: `type=gha` pulled base layers at 0,4 MB/s
      # (158 MB in 383 s) while Docker Hub delivered ~9 MB/s in the same run.
      # This job uses none, and must not start to.
      #
      # HOSTED RUNNERS ARE UNAFFECTED: their default builder is the same docker
      # driver, so public callers build exactly as before.

      # FOR REPOSITORIES WITHOUT AN IMAGE JOB OF THEIR OWN. A repository whose
      # pipeline already builds the image scans it there, in the same job, with
      # the action below (build once: the scanned image is the built one). This
      # workflow builds the image itself, and for a repository that also builds
      # it elsewhere that is a second build — which is why such a repository
      # calls the action from its own image job instead of this workflow.
      - name: build image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.target.context || '.' }}
          file: ${{ matrix.target.file || 'Dockerfile' }}
          platforms: linux/amd64
          push: false
          load: true
          tags: security-scan:${{ matrix.target.name }}
          build-args: ${{ matrix.target['build-args'] || '' }}
          # No provenance attestation on a throwaway scan image.
          #
          # With it, buildx attaches an attestation describing the build —
          # including packages from intermediate stages that never reach the
          # final filesystem. Trivy reads those and reports them with no file
          # path, which is indistinguishable from a real finding except that
          # nothing in the image has that version. Measured: a Python image
          # reported msgpack 1.1.2 and setuptools 70.3.0 alongside the 1.2.2 and
          # 84.0.0 actually installed, the old pair carrying `FilePath: -`.
          #
          # The image is built here only to be scanned and discarded, so the
          # attestation has no reader and costs a class of phantom finding.
          provenance: false
          sbom: false
          # Both build secrets every caller's Dockerfile might mount, because
          # this job has to build the same image the chain builds and a missing
          # one aborts that build. Measured 2026-09-25: a frontend Dockerfile
          # mounting `npm_token` fails `pnpm install` with exit 1 without it, and
          # the scan then reports a failure saying nothing about the image.
          # They carry the same value, and a secret a Dockerfile does not mount
          # is simply unused — so passing both costs nothing and removes a class
          # of false red.
          secrets: |
            "gh_packages_token=${{ secrets.GITHUB_TOKEN }}"
            "npm_token=${{ secrets.GITHUB_TOKEN }}"

      - name: built image
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          IMAGE_NAME: ${{ matrix.target.name }}
        run: |
          echo "built image: security-scan:$IMAGE_NAME $IMAGE_ID"

      # The scan, its blocking logic and the report upload live in the action,
      # so this workflow and every image job that scans in place run the same
      # lines.
      - name: trivy image scan
        uses: Kumbuka-ai/workflows/.github/actions/trivy-image-scan@feature/sprint-30-2-scan-the-built-image
        with:
          image: security-scan:${{ matrix.target.name }}
          name: ${{ matrix.target.name }}
          severity: ${{ inputs.trivy-severity }}
