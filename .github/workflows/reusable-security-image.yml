# Trivy against the container images a repository ships.
#
# Separate from `reusable-security.yml` rather than a job inside it, for a
# mechanical reason: this has a matrix over the images, and a matrix built from
# an empty list is not an empty matrix — GitHub refuses the whole workflow with
# a startup failure before any `if:` is evaluated. The alternative would be a
# sentinel entry so that a job could skip itself, which is a lie in the workflow
# to work around a parser. Repositories that ship no image do not call this.
#
# For the Maven repositories this is not an extra, it is the dependency scan.
# A filesystem scan of a pom.xml resolves only what the POM declares — the
# transitive closure needs the network, and Maven Central answers 429 to CI
# ranges. The image carries every jar that actually ships, so scanning it is
# both complete and offline. It also covers the base image's OS packages, which
# CodeQL never looked at.

name: security (images)

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner label set. Defaults to hosted, and the default stays hosted on
          purpose: this workflow is called by public repositories too, and a
          self-hosted default would hand anyone who opens a fork pull request a
          machine to run their code on.

          The private repositories of this organisation pass `apollo`. One
          label is enough — only those agents carry it, and they are registered
          into a runner group with selected repositories.
        required: false
        type: string
        default: ubuntu-latest
      trivy-severity:
        description: Severities that turn the run red. Everything below is reported.
        required: false
        type: string
        default: HIGH,CRITICAL
      image-targets:
        description: >-
          JSON array, one object per image:
          {"name": "...", "context": ".", "file": "Dockerfile", "build-args": ""}.
          A list, not a single image, because a repository may ship more than one
          — a backend and a frontend, say — and scanning one of two would report
          a coverage the repository does not have.
        required: true
        type: string

permissions:
  contents: read

jobs:

  trivy-image:
    name: trivy (image ${{ matrix.target.name }})
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.image-targets) }}
    permissions:
      contents: read
      packages: read
    env:
      # Pinned by digest. Version behind it: trivy 0.74.0.
      TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      SEVERITY: ${{ inputs.trivy-severity }}
      IMAGE_NAME: ${{ matrix.target.name }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          # THE DAEMON'S OWN BUILDER, NOT A CONTAINER ONE (satellite/29.17).
          #
          # Left to itself this action creates a `docker-container` builder, which
          # runs BuildKit in its own container with its OWN content store — so it
          # resolves every base image itself and never looks in the daemon's store.
          # Measured on apollo 2026-09-28: the same build takes 37,9 s that way
          # (2,3 s bootstrap + 35,6 s build, nearly all of it re-fetching
          # base images the machine already has) against 0,94 s with the `docker`
          # driver, which builds through the daemon and therefore sees them.
          #
          # THIS JOB MAY USE IT BECAUSE IT ASKS FOR NOTHING THE docker DRIVER LACKS:
          # one native platform (linux/amd64), `load: true`, `push: false`, and no
          # `cache-to`/`cache-from`. An external cache export or a second platform
          # WOULD need the container driver — which is why the image jobs of the
          # product repositories keep it, and each of them says so at its own step.
          # Measured with the same flags this job passes, `--provenance=false
          # --sbom=false --load --platform linux/amd64`: accepted, 944 ms.
          #
          # HOSTED RUNNERS ARE UNAFFECTED. Their default builder is the same docker
          # driver over the same Docker they already run; they simply have no local
          # store to profit from, and nothing here requires one.
          driver: docker

      # The image is built here rather than taken from the chain's own image job
      # on purpose: this workflow must not reach into another job's artefacts,
      # and it must not require an existing job to be changed. The cost is a
      # second build; the gain is that this job is self-contained and whatever
      # the repository already does stays untouched.
      - name: build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.target.context || '.' }}
          file: ${{ matrix.target.file || 'Dockerfile' }}
          platforms: linux/amd64
          push: false
          load: true
          tags: security-scan:${{ matrix.target.name }}
          build-args: ${{ matrix.target['build-args'] || '' }}
          # No provenance attestation on a throwaway scan image.
          #
          # With it, buildx attaches an attestation describing the build —
          # including packages from intermediate stages that never reach the
          # final filesystem. Trivy reads those and reports them with no file
          # path, which is indistinguishable from a real finding except that
          # nothing in the image has that version. Measured: a Python image
          # reported msgpack 1.1.2 and setuptools 70.3.0 alongside the 1.2.2 and
          # 84.0.0 actually installed, the old pair carrying `FilePath: -`.
          #
          # The image is built here only to be scanned and discarded, so the
          # attestation has no reader and costs a class of phantom finding.
          provenance: false
          sbom: false
          # Both build secrets every caller's Dockerfile might mount, because
          # this job has to build the same image the chain builds and a missing
          # one aborts that build. Measured 2026-09-25: a frontend Dockerfile
          # mounting `npm_token` fails `pnpm install` with exit 1 without it, and
          # the scan then reports a failure saying nothing about the image.
          # They carry the same value, and a secret a Dockerfile does not mount
          # is simply unused — so passing both costs nothing and removes a class
          # of false red.
          secrets: |
            "gh_packages_token=${{ secrets.GITHUB_TOKEN }}"
            "npm_token=${{ secrets.GITHUB_TOKEN }}"

      - name: trivy image scan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"

          started=$(date +%s)
          # Same register as the filesystem scan. It has to be mounted explicitly
          # here: this job talks to the docker socket, not to the checkout.
          IGNORE_ARG=""
          IGNORE_MOUNT=""
          if [ -f "$GITHUB_WORKSPACE/.trivyignore.yaml" ]; then
            IGNORE_ARG="--ignorefile /ignore/.trivyignore.yaml"
            IGNORE_MOUNT="-v $GITHUB_WORKSPACE/.trivyignore.yaml:/ignore/.trivyignore.yaml:ro"
            echo "Risk register in use:"
            cat "$GITHUB_WORKSPACE/.trivyignore.yaml"
          fi

          # The socket this runner actually talks to. A hosted runner has it at
          # /var/run/docker.sock and DOCKER_HOST is unset; a rootless daemon has
          # it under $XDG_RUNTIME_DIR and says so in DOCKER_HOST. Mounting the
          # fixed path on a rootless machine mounts nothing, and Trivy then
          # reports the image as not found -- "Cannot connect to the Docker
          # daemon at unix:///var/run/docker.sock" -- after the build step has
          # already succeeded, which reads like a broken image rather than a
          # missing mount. Measured on apollo 2026-09-26 across five
          # repositories. Inside the container it stays at the default path,
          # because that is where Trivy looks; only the host side moves.
          #
          # The expansion takes two steps because DOCKER_HOST may not be set
          # at all, and that is a case the line has to survive rather than the
          # exception it looks like: a hosted runner leaves it unset, while an
          # apollo slot sets it to unix:///var/run/docker.sock. Measured
          # 2026-09-28 on both. Under `set -u` a bare `${DOCKER_HOST#unix://}`
          # does not yield the empty string where the variable is unset -- it
          # aborts the step with "DOCKER_HOST: unbound variable" before the
          # fallback on the line below is ever reached, so the one case the
          # fallback exists for is the one that never gets there.
          # `${DOCKER_HOST:-}` turns unset into an empty string first; only
          # then is the prefix stripped.
          DOCKER_SOCK="${DOCKER_HOST:-}"
          DOCKER_SOCK="${DOCKER_SOCK#unix://}"
          [ -S "${DOCKER_SOCK:-}" ] || DOCKER_SOCK=/var/run/docker.sock
          echo "docker socket: $DOCKER_SOCK"

          # shellcheck disable=SC2086
          # TRIVY'S OWN TIMEOUT, RAISED FROM ITS 5-MINUTE DEFAULT (satellite/29.17).
          # The scan fails as `context deadline exceeded` when the five minutes run
          # out, and on this build host they run out under load rather than because
          # anything is wrong with the image: measured 2026-09-29, the same scan that
          # fails with thirteen jobs on the machine passes on an idle one. A deadline
          # that is a function of how busy the neighbours are is not a finding about
          # the code under test.
          #
          # THIS RAISES THE PATIENCE, NOT THE BAR. No scanner is skipped, no analyser
          # is switched off, no severity is downgraded, and `--exit-code`/the
          # blocking logic below are untouched: a vulnerability that was blocking
          # before this line is blocking after it. The only thing that changes is how
          # long Trivy waits before giving up on itself.
          #
          # Pre-seeding Trivy's databases into the golden image would remove the
          # download from the job altogether and is the obvious next lever — it is a
          # decision of its own and deliberately not part of this repair.
          docker run --rm \
            -v "$DOCKER_SOCK":/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache":/root/.cache/trivy \
            $IGNORE_MOUNT \
            "$TRIVY_IMAGE" image "security-scan:$IMAGE_NAME" $IGNORE_ARG \
            --scanners vuln \
            --timeout 15m \
            --list-all-pkgs \
            --format json --quiet \
            > "$RUNNER_TEMP/trivy-image.json"
          elapsed=$(( $(date +%s) - started ))

          cp "$RUNNER_TEMP/trivy-image.json" "$GITHUB_WORKSPACE/trivy-image-$IMAGE_NAME-report.json"

          pkgs=$(jq '[.Results[]?.Packages[]?] | length'         "$RUNNER_TEMP/trivy-image.json")
          targets=$(jq '[.Results[]?] | length'                  "$RUNNER_TEMP/trivy-image.json")
          vulns=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$RUNNER_TEMP/trivy-image.json")

          {
            echo "### Trivy — image \`$IMAGE_NAME\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| targets | $targets |"
            echo "| packages in image | $pkgs |"
            echo "| vulnerabilities (all severities) | $vulns |"
            echo "| runtime (scan only) | ${elapsed}s |"
            echo "| blocking severities | $SEVERITY |"
            echo "| image | \`$TRIVY_IMAGE\` |"
            echo
            echo "| severity | count |"
            echo "|---|---|"
            jq -r '[.Results[]?.Vulnerabilities[]?.Severity] | group_by(.)
                   | map({s: .[0], n: length}) | sort_by(-.n)[]
                   | "| \(.s) | \(.n) |"' "$RUNNER_TEMP/trivy-image.json"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "targets=$targets packages=$pkgs vulns=$vulns"

          # An image with no packages means the scan looked at nothing — which is
          # exactly what a green verdict would otherwise hide.
          if [ "$pkgs" -eq 0 ]; then
            echo "::error::Trivy found 0 packages in $IMAGE_NAME — the check had no search space, so its green verdict means nothing"
            exit 1
          fi

          echo "--- all findings (reported; only $SEVERITY block) ---"
          jq -r '.Results[]? | .Target as $t | (.Vulnerabilities // [])[]
                 | "\($t)  \(.Severity)  \(.PkgName)@\(.InstalledVersion)  \(.VulnerabilityID)  fixed:\(.FixedVersion // "-")"' \
                 "$RUNNER_TEMP/trivy-image.json" | sort || true

          # Only a fixable vulnerability blocks — see the filesystem job for the
          # reasoning. It matters most here: a base image carries OS packages
          # whose CVEs are routinely unfixed for months — a RedHat 9.8 layer
          # carrying pcre2 with `fixed:-` is the worked example. Blocking on
          # those would make this job permanently red without a single action
          # anyone could take.
          blocking=$(jq --arg sev "$SEVERITY" \
            '($sev | split(",")) as $s
             | [ .Results[]?.Vulnerabilities[]?
                 | select(.Severity as $x | $s | index($x))
                 | select((.FixedVersion // "") != "") ] | length' \
            "$RUNNER_TEMP/trivy-image.json")

          unfixed=$(jq --arg sev "$SEVERITY" \
            '($sev | split(",")) as $s
             | [ .Results[]?.Vulnerabilities[]?
                 | select(.Severity as $x | $s | index($x))
                 | select((.FixedVersion // "") == "") ] | length' \
            "$RUNNER_TEMP/trivy-image.json")

          {
            echo
            echo "| at $SEVERITY | count |"
            echo "|---|---|"
            echo "| with a fix available (blocking) | $blocking |"
            echo "| without a fix upstream (reported, not blocking) | $unfixed |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$unfixed" -gt 0 ]; then
            echo "::warning::$unfixed vulnerability/ies at $SEVERITY in $IMAGE_NAME have no fix upstream — reported, not blocking. They will block automatically once a fix is published."
            jq -r '.Results[]? | (.Vulnerabilities // [])[]
                   | select((.FixedVersion // "") == "")
                   | "  UNFIXED \(.Severity)  \(.PkgName)@\(.InstalledVersion)  \(.VulnerabilityID)"' \
                   "$RUNNER_TEMP/trivy-image.json" | sort -u || true
          fi

          if [ "$blocking" -gt 0 ]; then
            echo "::error::Trivy found $blocking fixable vulnerability/ies at $SEVERITY in $IMAGE_NAME"
            exit 1
          fi

          echo "Trivy image $IMAGE_NAME: $pkgs packages, nothing at $SEVERITY."

      # Each job has its own workspace, so each uploads what it produced.
      # The overview script reads these rather than scraping logs.
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report-image-${{ matrix.target.name }}
          path: |
            trivy-image-*-report.json
          if-no-files-found: ignore
          retention-days: 30
